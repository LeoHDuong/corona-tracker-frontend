replicaCount: 1

image:
  repository: harbor/corona-tracker/frontend
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: harbor-secret

service:
  type: NodePort
  port: 3000
  targetPort: 3000
  nodePort: 30000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 60
  periodSeconds: 15
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 60
  periodSeconds: 15
  failureThreshold: 5

autoscaling:
  enabled: false
